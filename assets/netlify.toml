[build]
  publish = "."

[[redirects]]
  from = "/support"
  to = "/?page=Support%20Us"
  status = 301

[[redirects]]
  from = "/partner"
  to = "/?page=Support%20Us"
  status = 301

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
